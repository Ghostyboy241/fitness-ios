workflows:
  ios-workflow:
    name: iOS Build
    environment:
      node: latest
      xcode: latest
    scripts:
      - name: Paketleri kur ve iOS projesi oluştur
        script: |
          set -e
          npm install
          npx cap add ios
      - name: İmzalanmamış IPA derle
        script: |
          set -e
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r ../../FitnessTracker.ipa Payload
    artifacts:
      - FitnessTracker.ipa
