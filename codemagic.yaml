workflows:
  ios-workflow:
    name: iOS Build
    environment:
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Paketleri kur ve iOS projesi oluştur
        script: |
          set -e
          npm install
          npx cap add ios
          npx cap sync ios
      - name: İmzalanmamış IPA derle
        script: |
          set -e
          cd ios/App
          pod install
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO clean build
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r ../../FitnessTracker.ipa Payload
    artifacts:
      - FitnessTracker.ipa
